name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Sign plugin
        if: env.GRAFANA_ACCESS_POLICY_TOKEN != ''
        run: npx --yes @grafana/sign-plugin@latest
        continue-on-error: true

      - name: Package plugin
        id: package
        run: |
          PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          PLUGIN_VERSION=$(cat dist/plugin.json | jq -r .info.version)
          ARCHIVE="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"
          mv dist "$PLUGIN_ID"
          zip -r "${ARCHIVE}" "$PLUGIN_ID"
          SHA1=$(sha1sum "$ARCHIVE" | cut -d' ' -f1)
          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT
          echo "sha1=${SHA1}" >> $GITHUB_OUTPUT
          echo "Built ${ARCHIVE} (SHA1: ${SHA1})"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ./${{ steps.package.outputs.archive }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: ./${{ steps.package.outputs.archive }}
          body: |
            **SHA1:** `${{ steps.package.outputs.sha1 }}`

            ## Install

            Download the `.zip` file below and extract it into your Grafana plugins directory, then restart Grafana.
