name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Debug source maps
        run: |
          echo "=== Checking line endings of source files ==="
          for f in src/datasource.ts src/types.ts src/module.ts src/components/ConfigEditor.tsx src/components/QueryEditor.tsx; do
            echo "$f: $(file $f)"
            echo "  bytes: $(wc -c < $f)"
            echo "  CR count: $(tr -cd '\r' < $f | wc -c)"
          done
          echo ""
          echo "=== Comparing source map sourcesContent vs source files ==="
          node -e "
            const fs = require('fs');
            const map = JSON.parse(fs.readFileSync('dist/module.js.map','utf8'));
            const prefix = 'webpack://gotwoods-seq-datasource/./';
            map.sources.forEach((src, i) => {
              if (src.startsWith(prefix)) {
                const file = src.slice(prefix.length);
                if (fs.existsSync(file)) {
                  const fileContent = fs.readFileSync(file, 'utf8');
                  const mapContent = map.sourcesContent[i];
                  if (fileContent === mapContent) {
                    console.log(file + ': MATCH');
                  } else {
                    console.log(file + ': MISMATCH');
                    console.log('  map length: ' + mapContent.length + ', file length: ' + fileContent.length);
                    for (let j = 0; j < Math.min(mapContent.length, fileContent.length); j++) {
                      if (mapContent[j] !== fileContent[j]) {
                        console.log('  first diff at pos ' + j + ': map=' + JSON.stringify(mapContent.slice(j,j+30)) + ' file=' + JSON.stringify(fileContent.slice(j,j+30)));
                        break;
                      }
                    }
                  }
                }
              }
            });
          "

      - name: Sign plugin
        if: env.GRAFANA_ACCESS_POLICY_TOKEN != ''
        run: npx --yes @grafana/sign-plugin@latest
        continue-on-error: true

      - name: Package plugin
        id: package
        run: |
          PLUGIN_ID=$(cat dist/plugin.json | jq -r .id)
          PLUGIN_VERSION=$(cat dist/plugin.json | jq -r .info.version)
          ARCHIVE="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"
          mv dist "$PLUGIN_ID"
          zip -r "${ARCHIVE}" "$PLUGIN_ID"
          SHA1=$(sha1sum "$ARCHIVE" | cut -d' ' -f1)
          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT
          echo "sha1=${SHA1}" >> $GITHUB_OUTPUT
          echo "Built ${ARCHIVE} (SHA1: ${SHA1})"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: ./${{ steps.package.outputs.archive }}
          body: |
            **SHA1:** `${{ steps.package.outputs.sha1 }}`

            ## Install

            Download the `.zip` file below and extract it into your Grafana plugins directory, then restart Grafana.
